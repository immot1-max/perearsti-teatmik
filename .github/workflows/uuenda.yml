name: Andmete kontroll

on:
  schedule:
    # Esmaspäeval ja neljapäeval kell 04:17 UTC (Eesti aja järgi 07:17 suvel, 06:17 talvel).
    # Kaks korda nädalas, sest GitHub kustutab vahemälu kirje, mida pole 7 päeva loetud: harvema kontrolli korral
    # algaks iga käivitus tühja Riigi Teataja vahemäluga ja tõrke korral ei oleks eelmist teksti, millele toetuda.
    - cron: "17 4 * * 1,4"
  workflow_dispatch:
    inputs:
      luba_kahanemine:
        description: "Luba andmete kahanemine (avaldamise värav peatas ehituse, kuid muutus on tegelik)"
        type: boolean
        default: false
  push:
    branches: [main]
    # Kogu ehitaja kood ja seadistus; aruanne on ehituse väljund.
    paths:
      - "build/**"
      - "!build/report.md"

permissions:
  contents: write
  issues: write

concurrency:
  group: andmed
  cancel-in-progress: false

jobs:
  kontroll:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt

      # Vahemälu taastatakse ja salvestatakse eraldi sammudes, et ka katkenud ehituse
      # järel jääks alla laaditud Riigi Teataja tekst järgmiseks korraks alles.
      - name: Riigi Teataja vahemälu (taastamine)
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: build/cache
          key: rt-${{ hashFiles('build/sources.json') }}-${{ github.run_id }}
          restore-keys: rt-

      - name: Sõltuvused
        run: pip install -r build/requirements.txt

      # Sammu ajapiir on väiksem kui töö oma, et vahemälu salvestamine ja veateade jõuaksid ka siis toimuda.
      - name: Kontrolli ja ehita
        id: b
        timeout-minutes: 32
        env:
          PYTHONUNBUFFERED: "1"
          # Riigi Teataja vastab GitHubi serveritele kiirete päringute järel 429-ga; päringute vahe sekundites.
          RT_VAHE: "6"
          LUBA_KAHANEMINE: ${{ inputs.luba_kahanemine && '1' || '' }}
        run: python build/build.py

      - name: Riigi Teataja vahemälu (salvestamine)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: build/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Uued andmed avaldatakse ainult siis, kui rakendus nendega avaneb: suitsutest käivitab rakenduse
      # värskelt ehitatud andmefailiga (vahelehed, otsing, iga kategooria kirjed, kõik teemakaardid).
      - name: Rakenduse suitsutest uute andmetega
        if: steps.b.outputs.changed == 'true'
        run: |
          npm ci --prefix tests --no-audit --no-fund
          node tests/smoke.js

      - name: Salvesta uued andmed
        if: steps.b.outputs.changed == 'true'
        run: |
          git config user.name "teatmiku-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lisad
          git add data build/sources.json build/report.md build/toru/toru_valjavote.json
          git commit -m "Andmete uuendus $(date +%Y-%m-%d)" || exit 0
          # Ehitus kestab kaua; kui harule lükati vahepeal teine commit, tõstetakse andmete commit selle peale,
          # muidu lükkaks GitHub pushi tagasi ja ehituse tulemus läheks kaotsi. Kui ka teine commit muutis
          # andmefaili, jääb samm konflikti tõttu pooleli ja töövoog avab veateate.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      # Andmed ei muutunud: salvestatakse ainult kontrolli kuupäev (data/version.json), et rakendus saaks näidata,
      # millal viimati kontrolliti. Ühtlasi on see repo tegevus: avalikus repos lülitab GitHub ajastatud töövoo välja,
      # kui 60 päeva ei ole ühtki muudatust.
      - name: Salvesta kontrolli kuupäev
        if: steps.b.outputs.changed != 'true' && steps.b.outputs.checked == 'true'
        run: |
          git config user.name "teatmiku-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/version.json
          git commit -m "Kontroll $(date +%Y-%m-%d): muudatusi ei ole" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: Teavita muudatustest
        if: steps.b.outputs.changed == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Teatmiku andmed uuenesid $(date +%d.%m.%Y)" --body-file build/report.md

      # Andmed muutusteta, kuid osa akte jäi Riigi Teataja tõrke tõttu kontrollimata.
      - name: Teavita Riigi Teataja tõrkest
        if: steps.b.outputs.rt == 'true' && steps.b.outputs.changed != 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "" >> build/rt_viga.md
          echo "Logi: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> build/rt_viga.md
          bash .github/teata.sh "Teatmiku kontroll: Riigi Teataja ei vastanud" "Teatmiku kontroll: Riigi Teataja ei vastanud $(date +%d.%m.%Y)" build/rt_viga.md

      - name: Teavita veast
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automaatne kontroll ebaõnnestus. Logi: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -f build/varav_viga.md ]; then echo ""; cat build/varav_viga.md; fi
            if [ -f build/rt_viga.md ]; then echo ""; cat build/rt_viga.md; fi
          } > "$RUNNER_TEMP/viga.md"
          bash .github/teata.sh "Teatmiku andmete kontroll ebaõnnestus" "Teatmiku andmete kontroll ebaõnnestus $(date +%d.%m.%Y)" "$RUNNER_TEMP/viga.md"
